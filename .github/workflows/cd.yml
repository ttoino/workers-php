name: CD

on:
    release:
        types: [published]
    workflow_dispatch:

permissions:
    contents: read
    id-token: write

jobs:
    publish:
        name: Publish
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v6
            - name: Install pnpm
              uses: pnpm/action-setup@v6
            - name: Install node
              uses: actions/setup-node@v6
              with:
                  node-version: 22
                  cache: "pnpm"
            - name: Check the tag matches the package version
              if: github.event_name == 'release'
              run: |
                  tag="${GITHUB_REF_NAME#v}"
                  pkg=$(node -p "require('./packages/workers-php/package.json').version")
                  if [ "$tag" != "$pkg" ]; then
                      echo "::error::tag ${GITHUB_REF_NAME} does not match workers-php@${pkg}"
                      exit 1
                  fi
            - name: Install dependencies
              run: pnpm install --frozen-lockfile
            - name: Publish to npm
              run: pnpm --filter workers-php publish --access public --no-git-checks
