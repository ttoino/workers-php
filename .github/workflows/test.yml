name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: typecheck
        run: npx tsc --noEmit

      # wrangler.jsonc declares assets.directory=./dist; vitest-pool-workers
      # validates it at startup. dist/ is gitignored (built artifact), so
      # produce it on CI.
      - name: build demo bundle
        run: npm run build-php

      - name: tests
        # Explicit `vitest run` (npm test alone enters watch-mode semantics
        # in some environments) + per-test verbose output so a stall is
        # visible in the log.
        run: npx vitest run --reporter=verbose
